[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --cov=backend --cov-report=term-missing --cov-fail-under=85
markers =
    eval: RAG metric evaluation tests (require live Qdrant + Ollama; slow, ~15-25 min)
    behavioral: Pipeline behavioral tests (require Qdrant + Ollama; run max 2-3 at a time due to Ollama memory)
